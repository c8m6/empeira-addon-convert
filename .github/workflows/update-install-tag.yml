name: Update installation tag

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Update README installation reference
        shell: bash
        run: |
          set -euo pipefail
          tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
          if [ -z "$tag" ]; then
            tag="$(git tag --sort=-version:refname | head -n 1)"
          fi
          if [ -z "$tag" ]; then
            exit 0
          fi
          LATEST_TAG="$tag" python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("README.md")
          original = path.read_text()
          updated, count = re.subn(
              r"(?m)^(    ref: )[^\n]+$",
              lambda m: m.group(1) + os.environ["LATEST_TAG"],
              original,
              count=1,
          )
          if count != 1:
              raise SystemExit("README installation ref not found")
          if updated != original:
              path.write_text(updated)
          PY
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: point installation to latest tag"
          git push origin HEAD:main
