name: Update installation tag

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Open README update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | sed -n '1p')"
          if [ -z "$tag" ]; then
            tag="$(git tag --sort=-version:refname | sed -n '1p')"
          fi
          [ -n "$tag" ] || exit 0

          LATEST_TAG="$tag" python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("README.md")
          original = path.read_text()
          updated, count = re.subn(
              r"(?m)^(    ref: )[^\n]+$",
              lambda match: match.group(1) + os.environ["LATEST_TAG"],
              original,
              count=1,
          )
          if count != 1:
              raise SystemExit("README installation ref not found")
          if updated != original:
              path.write_text(updated)
          PY

          git diff --quiet -- README.md && exit 0
          branch="docs/install-ref-${tag//[^a-zA-Z0-9._-]/-}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add README.md
          git commit -m "docs: point installation to $tag"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
          fi
          git push --force-with-lease origin "$branch"
          if ! gh pr list --head "$branch" --state open --json number --jq '.[0].number' | grep -q .; then
            gh pr create --base main --head "$branch" \
              --title "docs: point installation to $tag" \
              --body "Automatically generated installation reference update for the latest tag. Requires normal review/merge because main is protected."
          fi
